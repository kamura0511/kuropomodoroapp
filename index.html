<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1a1512">
<title>クロ ポモドーロ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="app">
  <section class="stage" id="stage" aria-label="クロ（タップすると話しかけられるよ）">
    <div class="scene" id="scene">
      <img class="layer" src="assets/bg.jpg" alt="">
      <div class="char" id="char">
        <img class="layer" src="assets/char.webp" alt="クロ">
        <!-- パーツは app.js の CONFIG.parts の座標で配置する -->
      </div>
    </div>
    <p class="bubble" id="bubble" hidden></p>
  </section>

  <section class="panel">
    <div class="phase" id="phase">作業</div>

    <div class="clock">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-bg" cx="60" cy="60" r="54"></circle>
        <circle class="ring" id="ring" cx="60" cy="60" r="54" pathLength="100"></circle>
      </svg>
      <div class="time" id="time">25:00</div>
    </div>

    <div class="dots" id="dots" aria-label="4回ごとに長い休憩"><i></i><i></i><i></i><i></i></div>

    <div class="buttons">
      <button class="main" id="mainBtn">スタート</button>
      <button class="sub" id="skipBtn" hidden>休憩おわり</button>
      <button class="sub" id="resetBtn" hidden>リセット</button>
    </div>

    <div class="meta">
      <button class="chip" id="todayBtn">今日 <b id="today">0</b> 回</button>
      <button class="chip" id="muteBtn" aria-pressed="false">🔈 声あり</button>
    </div>

    <p class="credit">音声: VOICEVOX:冥鳴ひまり</p>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
